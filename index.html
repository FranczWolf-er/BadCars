<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>BadCars – evidence provozu auta</title>

<style>
:root{
  --bg:#f4f6f7;--card:#fff;--ink:#14201f;--mute:#5b6b69;--line:#dbe2e1;
  --acc:#0f766e;--acc-ink:#fff;--fuel:#0f766e;--svc:#d97706;
  --ok:#166534;--okbg:#dcfce7;--soon:#92400e;--soonbg:#fef3c7;--late:#991b1b;--latebg:#fee2e2;
  --danger:#b91c1c;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1514;--card:#17211f;--ink:#e6efed;--mute:#9db0ad;--line:#2a3836;
  --acc:#2dd4bf;--acc-ink:#042f2a;--fuel:#2dd4bf;--svc:#fbbf24;
  --ok:#86efac;--okbg:#14351f;--soon:#fcd34d;--soonbg:#3b2a0a;--late:#fca5a5;--latebg:#431414;--danger:#f87171;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
header select{flex:1;min-width:0;font:inherit;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.sync{font-size:11px;color:var(--mute);white-space:nowrap}.sync.local,.sync.err{color:var(--soon)}
.iconbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;padding:12px 0;cursor:pointer}
nav button[aria-current=page]{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
h2{font-size:15px;margin:18px 2px 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.k{font-size:12px;color:var(--mute)}
.v{font-size:22px;font-weight:700;margin-top:2px}
.v small{font-size:13px;font-weight:500;color:var(--mute)}
.sub{font-size:12px;color:var(--mute);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.actions .btn{flex:1;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.row .r1{display:flex;justify-content:space-between;gap:8px}
.row .r2{font-size:13px;color:var(--mute);margin-top:2px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.pri{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;white-space:nowrap;vertical-align:1px}.pri.high{background:var(--latebg);color:var(--late)}.pri.low{background:var(--line);color:var(--mute)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.soon{background:var(--soonbg);color:var(--soon)}.chip.late{background:var(--latebg);color:var(--late)}
.empty{color:var(--mute);text-align:center;padding:22px 10px;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar .t{height:14px;background:var(--bg);border-radius:7px;overflow:hidden;display:flex}
.bar .t i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.banner{background:var(--soonbg);color:var(--soon);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:10px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;background:var(--card);border-radius:18px 18px 0 0;max-width:640px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.ph h2{margin:0;font-size:18px;color:var(--ink);text-transform:none;letter-spacing:0}
.x{border:0;background:none;color:var(--mute);font-size:20px;padding:4px 8px;cursor:pointer}
.pb{overflow:auto;padding:6px 16px 10px}
.pf{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.pf .btn{flex:1}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,textarea,select.f{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:140px;font:12px/1.3 ui-monospace,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--ink);font-size:16px}
.chk input{width:22px;height:22px}
.err{color:var(--danger);font-size:14px;margin:8px 0 0;min-height:1em}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}.seg button{flex:1;border:0;background:var(--card);color:var(--mute);font:inherit;font-weight:600;padding:10px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}.kv span:first-child{color:var(--mute)}.kv b{text-align:right;word-break:break-word}
.big{font-size:26px;font-weight:700}.res{margin-top:14px;display:flex;flex-direction:column;gap:6px}.res .line{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0;font-size:15px}.res .line span:first-child{color:var(--mute)}
.chips button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.yc{width:100%;border-collapse:collapse;font-size:13px}.yc th,.yc td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}.yc th:first-child,.yc td:first-child{text-align:left;white-space:normal}.yc th{color:var(--mute);font-weight:600}.yc small{color:var(--mute)}
.grid.editing [data-tile]{position:relative;padding-bottom:30px;touch-action:manipulation;transition:transform .12s;user-select:none;-webkit-user-select:none;cursor:grab;outline:2px dashed var(--line);outline-offset:-2px}.grid.editing [data-tile][data-sel]{touch-action:none;outline:3px solid var(--acc);outline-offset:-3px;transform:scale(1.03);z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.25)}.grid.editing [data-tile].dragging{transition:none;z-index:20;cursor:grabbing;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:.95}.grid.editing .tx{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--late,#d33);color:#fff;font-size:14px;line-height:28px;padding:0;z-index:2;cursor:pointer}.grid.editing .tp{position:absolute;bottom:6px;right:6px;font-size:11px;padding:2px 7px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}.addtile{border:2px dashed var(--line)!important;background:transparent!important;color:var(--mute);font-size:15px;min-height:84px;cursor:pointer}
.tlm{display:flex;justify-content:space-between;align-items:baseline}.tlm span{font-weight:500;color:var(--mute);font-size:12px;text-transform:none}.tl{position:relative;margin:0 0 6px 14px;border-left:2px solid var(--line);padding-left:4px}.tle{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:8px 4px 8px 0;cursor:pointer;font:inherit;position:relative}.tli{flex:0 0 30px;height:30px;margin-left:-21px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px}.tl-svc .tli{border-color:var(--svc)}.tl-fuel .tli{border-color:var(--fuel)}.tl-task .tli{border-color:var(--ok,#2a7)}.tlb{flex:1;min-width:0}.tlb .r1{display:flex;justify-content:space-between;gap:8px}.tlb .r1 b{font-weight:600}.tlb .r1 span{white-space:nowrap;font-weight:600}.tlb .r2{display:block;color:var(--mute);font-size:13px;margin-top:2px}.tlf{flex-wrap:wrap}
.helpbar{background:var(--okbg);color:var(--ink);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px;display:flex;align-items:center;justify-content:space-between}.grid.helpon .card{outline:2px dashed var(--acc);outline-offset:-2px;cursor:help}
.lc{width:100%;height:auto;display:block}.lc text{fill:var(--mute);font-size:10px}.lc .g{stroke:var(--line);stroke-width:1}.lc .ln{fill:none;stroke:var(--fuel);stroke-width:2.2;stroke-linejoin:round}.lc .av{stroke:var(--svc);stroke-width:1.2;stroke-dasharray:4 3}.lc circle.d{fill:var(--card);stroke:var(--fuel);stroke-width:2}.lc circle.h{fill:transparent;cursor:pointer}
.tiles-ed .row2{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}.tiles-ed label{flex:1;margin:0;display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)}.tiles-ed .mv{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;width:36px;height:34px;font-size:15px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header>
  <select id="veh" aria-label="Vozidlo"></select>
  <span id="sync" class="sync" role="status"></span>
  <button class="iconbtn" data-act="settings" aria-label="Nastavení">⚙</button>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheet"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10));

/* ---------- úložiště ---------- */
const KEY='badcars.v1';
let storageOk=true;
function loadDb(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){storageOk=false;}return null;}
let db=loadDb()||{v:1,vehicles:[],fuelings:[],odos:[],repairs:[],tasks:[],fixed:[],tires:[],tireEvents:[],parts:[],trips:[],expenses:[],activeVehicle:null};
db.fixed=db.fixed||[];db.tires=db.tires||[];db.tireEvents=db.tireEvents||[];db.parts=db.parts||[];db.trips=db.trips||[];db.expenses=db.expenses||[];
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){storageOk=false;}}
function persist(){persistLocal();try{localStorage.setItem('badcars.lastChange',String(Date.now()));}catch(e){}schedulePush();}
const touch=r=>{r.updatedAt=Date.now();return r;};
function saveSettings(o){db.settings=Object.assign({},db.settings||{},o,{updatedAt:Date.now()});persist();}
function adoptSettings(x){if(x&&typeof x==='object'&&(x.updatedAt||0)>((db.settings||{}).updatedAt||0)){db.settings=JSON.parse(JSON.stringify(x));persistLocal();return true;}return false;}
const newerSettings=(a,b)=>!a?b:(!b?a:((b.updatedAt||0)>(a.updatedAt||0)?b:a));

// <calc>
const DAY=864e5;
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayIso=()=>isoD(new Date());
function addMonths(s,n){const a=s.split('-').map(Number);const t=new Date(a[0],a[1]-1+n,1);const dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(a[2],dim));return isoD(t);}
const live=(k,vid)=>db[k].filter(x=>!x.deleted&&x.vehicleId===vid);
const vehicleById=id=>db.vehicles.find(v=>v.id===id&&!v.deleted);
function odoPoints(vid){
  const p=[],v=vehicleById(vid);
  if(v&&v.startOdo!=null)p.push({id:v.id,date:v.startDate||todayIso(),odo:v.startOdo,src:'start'});
  live('fuelings',vid).forEach(f=>p.push({id:f.id,date:f.date,odo:f.odo,src:'fuel'}));
  live('odos',vid).forEach(f=>p.push({id:f.id,date:f.date,odo:f.odo,src:'odo'}));
  live('repairs',vid).forEach(f=>{if(f.odo!=null)p.push({id:f.id,date:f.date,odo:f.odo,src:'repair'});});
  live('expenses',vid).forEach(f=>{if(f.odo!=null)p.push({id:f.id,date:f.date,odo:f.odo,src:'exp'});});
  live('tireEvents',vid).forEach(f=>p.push({id:f.id,date:f.date,odo:f.odo,src:'tire'}));
  live('trips',vid).forEach(f=>{if(f.odoStart!=null)p.push({id:f.id+'-s',date:f.date,odo:f.odoStart,src:'trip'});if(f.odoEnd!=null)p.push({id:f.id,date:f.date,odo:f.odoEnd,src:'trip'});});
  live('parts',vid).forEach(f=>{if(f.odo!=null)p.push({id:f.id,date:f.date,odo:f.odo,src:'part'});if(f.removedOdo!=null&&f.removedDate)p.push({id:f.id+'-r',date:f.removedDate,odo:f.removedOdo,src:'part'});});
  return p;
}
function currentOdo(vid){const p=odoPoints(vid);return p.length?Math.max.apply(null,p.map(x=>x.odo)):null;}
function checkOdo(vid,date,odo,excludeId){
  for(const p of odoPoints(vid)){
    if(p.id===excludeId||p.src==='start')continue;
    if(p.date<date&&p.odo>odo)return 'Starší záznam ('+fdate(p.date)+') má vyšší stav: '+nf(p.odo)+' km.';
    if(p.date>date&&p.odo<odo)return 'Novější záznam ('+fdate(p.date)+') má nižší stav: '+nf(p.odo)+' km.';
  }
  return null;
}
function fuelSegments(vid){
  const fuels=live('fuelings',vid).sort((a,b)=>a.odo-b.odo||a.date.localeCompare(b.date));
  const segs=[];let base=null,acc=0;
  for(const f of fuels){
    if(base===null){if(f.full)base=f;continue;}
    acc+=f.liters;
    if(f.full){
      const km=f.odo-base.odo;
      if(km>0&&acc>0)segs.push({id:f.id,date:f.date,odo:f.odo,km:km,liters:acc,l100:acc/km*100});
      base=f;acc=0;
    }
  }
  return segs;
}
function consStats(segs){
  const agg=a=>{const L=a.reduce((s,x)=>s+x.liters,0),K=a.reduce((s,x)=>s+x.km,0);return K>0?L/K*100:null;};
  return {last:segs.length?segs[segs.length-1].l100:null,avg5:segs.length?agg(segs.slice(-5)):null,avg:segs.length?agg(segs):null};
}
function sortedFuels(vid){return live('fuelings',vid).sort((a,b)=>a.odo-b.odo||a.date.localeCompare(b.date));}
function approxCons(vid,n){
  const f=sortedFuels(vid);if(f.length<2||(n&&f.length<n+1))return null;
  const w=n?f.slice(-(n+1)):f,km=w[w.length-1].odo-w[0].odo;
  if(km<=0)return null;
  return w.slice(1).reduce((s,x)=>s+x.liters,0)/km*100;
}
function rollingCons(vid,n){
  const f=sortedFuels(vid),out=[];
  for(let i=n;i<f.length;i++){const w=f.slice(i-n,i+1),km=w[n].odo-w[0].odo;if(km>0)out.push({id:f[i].id,date:f[i].date,l100:w.slice(1).reduce((s,x)=>s+x.liters,0)/km*100});}
  return out;
}
function periodStats(vid,ym){
  const f=sortedFuels(vid),inP=d=>!ym||d.startsWith(ym);
  const inside=f.filter(x=>inP(x.date)),before=ym?f.filter(x=>x.date<ym):[];
  const reps=live('repairs',vid).filter(r=>inP(r.date));
  const out={n:inside.length,spent:sumCost(inside),liters:inside.reduce((s,x)=>s+x.liters,0),rep:reps.reduce((s,r)=>s+repCost(r),0),repN:reps.length,oth:expSum(vid,inP),othN:live('expenses',vid).filter(x=>inP(x.date)).length,km:0,fixed:0,allPerKm:null,l100:null,fuelPerKm:null,totalPerKm:null};
  if(!inside.length)return out;
  const baseBefore=before.length?before[before.length-1]:null,base=baseBefore||inside[0];
  const list=baseBefore?inside:inside.slice(1),last=inside[inside.length-1];
  out.km=last.odo-base.odo;
  if(out.km>0&&list.length){
    const L=list.reduce((s,x)=>s+x.liters,0),C=sumCost(list);
    const repKm=reps.filter(r=>r.date<=last.date).reduce((s,r)=>s+repCost(r),0)+expSum(vid,d=>inP(d)&&d<=last.date);
    out.fixed=fixedShare(vid,base.date,last.date);
    out.l100=L/out.km*100;out.fuelPerKm=C/out.km;out.totalPerKm=(C+repKm)/out.km;out.allPerKm=(C+repKm+out.fixed)/out.km;
  }
  return out;
}
function fixedShare(vid,a,b){
  const items=live('fixed',vid);if(!items.length||!a||!b||a>b)return 0;
  let tot=0;
  for(let y=+a.slice(0,4);y<=+b.slice(0,4);y++){
    const sum=items.filter(x=>x.year===y).reduce((s,x)=>s+(x.amount||0),0);if(!sum)continue;
    const ys=a>y+'-01-01'?a:y+'-01-01',ye=b<y+'-12-31'?b:y+'-12-31';
    const days=Math.round((pd(ye)-pd(ys))/DAY)+1;if(days<=0)continue;
    const diy=(y%4===0&&y%100!==0)||y%400===0?366:365;tot+=sum*days/diy;
  }
  return tot;
}
const isOneTime=t=>!t.intervalKm&&!t.intervalMonths;
function tireKm(vid){
  const ev=live('tireEvents',vid).sort((a,b)=>a.date.localeCompare(b.date)||a.odo-b.odo),cur=currentOdo(vid),km={},open={};
  const close=(id,odo)=>{if(open[id]!=null){if(odo>open[id])km[id]=(km[id]||0)+odo-open[id];delete open[id];}};
  ev.forEach(e=>{
    if(e.type==='off')close(e.tireId,e.odo);
    else{Object.keys(open).forEach(id=>{if(id!==e.tireId)close(id,e.odo);});if(open[e.tireId]==null)open[e.tireId]=e.odo;}
  });
  const mounted=Object.keys(open);
  mounted.forEach(id=>{if(cur!=null&&cur>open[id])km[id]=(km[id]||0)+cur-open[id];});
  return {km:km,mountedId:mounted.length?mounted[0]:null,mounted:mounted,events:ev};
}
function dotAge(dot){
  const m=/^(\d{2})(\d{2})$/.exec(String(dot||'').trim());if(!m)return null;
  const w=+m[1],y=2000+ +m[2];if(w<1||w>53)return null;
  return (Date.now()-new Date(y,0,1+(w-1)*7).getTime())/(365.25*DAY);
}
function lastTread(t){const a=(t.treads||[]).slice().sort((x,y)=>x.date.localeCompare(y.date));return a.length?a[a.length-1]:null;}
function rangeStats(vid,a,b){
  const f=sortedFuels(vid),inR=d=>d>=a&&d<=b,inside=f.filter(x=>inR(x.date)),before=f.filter(x=>x.date<a);
  const reps=live('repairs',vid).filter(r=>inR(r.date)),fuel=sumCost(inside),rep=reps.reduce((s,r)=>s+repCost(r),0),liters=inside.reduce((s,x)=>s+x.liters,0);
  const base=before.length?before[before.length-1]:inside[0],last=inside[inside.length-1];

function validRec(k,x){
  const isN=v=>typeof v==='number'&&isFinite(v),dOk=v=>requireDate(v);
  if(x.deleted)return true;
  switch(k){
    case 'vehicles':return typeof x.name==='string'&&!!x.name.trim();
    case 'fuelings':return dOk(x.date)&&isN(x.odo)&&isN(x.liters)&&x.liters>0&&isN(x.total)&&x.total>=0&&!!x.vehicleId;
    case 'repairs':return dOk(x.date)&&typeof x.title==='string'&&!!x.vehicleId&&(x.odo==null||isN(x.odo));
    case 'odos':return dOk(x.date)&&isN(x.odo)&&!!x.vehicleId;
    case 'tasks':return typeof x.name==='string'&&!!x.vehicleId;
    case 'fixed':return isN(x.year)&&isN(x.amount)&&!!x.vehicleId;
    case 'tireEvents':return dOk(x.date)&&isN(x.odo)&&!!x.tireId;
    case 'parts':return dOk(x.date)&&typeof x.name==='string'&&!!x.vehicleId;
    case 'expenses':return dOk(x.date)&&isN(x.amount)&&x.amount>=0&&!!x.vehicleId;
    case 'trips':return dOk(x.date)&&!!x.vehicleId&&(isN(x.km)||(isN(x.odoStart)&&isN(x.odoEnd)));
    default:return !!x.vehicleId||k==='vehicles';
  }
}
function mergeDb(inc){
  if(!inc||typeof inc!=='object')throw new Error('Neplatný soubor.');
  inc=JSON.parse(JSON.stringify(inc));
  let n=0;
  ['vehicles','fuelings','odos','repairs','tasks','fixed','tires','tireEvents','parts','trips','expenses'].forEach(k=>{
    db[k]=db[k]||[];
    if(inc[k]!==undefined&&!Array.isArray(inc[k]))throw new Error('Neplatná data ('+k+').');
    const m=new Map(db[k].map(x=>[x.id,x]));
    (inc[k]||[]).forEach(x=>{if(!x||typeof x!=='object'||!x.id||!validRec(k,x))return;const c=m.get(x.id);if(!c||(x.updatedAt||0)>(c.updatedAt||0)){m.set(x.id,x);n++;}});
    db[k]=Array.from(m.values());
  });
  if(adoptSettings(inc.settings))n++;
  persistLocal();return n;
}

      if(!t.lastDate||t.lastDate<d){if(t.lastDate)(t.history=t.history||[]).push({date:t.lastDate,odo:t.lastOdo});t.lastDate=d;touch(t);}});
    mark('p9-stk-register');
  }
}
/* ---------- záloha do cloudu: OneDrive (Graph, PKCE) a Google Drive (appDataFolder) ---------- */
const CFG=Object.assign({clientId:'',tenant:'common',googleClientId:''},window.BADCARS_CONFIG||{});
const REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');
const CUR_KEY='badcars.cloud',PEND_KEY='badcars.auth.pending',LAST_KEY='badcars.lastBackup',FILE_KEY='badcars.lastFileBackup',WAS_KEY='badcars.cloud.was';
let cloud=null,syncSt='local',pushT=null,pushing=false,again=false,offer=0,lastPushed='',odMsg='',loginNeeded=false;
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k);}catch(e){}};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
const rand=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>('0'+x.toString(16)).slice(-2)).join('');};
async function s256(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return btoa(String.fromCharCode.apply(null,new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
const authErr=()=>{const e=new Error('auth');e.auth=true;return e;};
const tokKey=p=>'badcars.tok.'+p;
function getTok(p){try{return JSON.parse(lsGet(tokKey(p)));}catch(e){return null;}}
function setTok(p,t){lsSet(tokKey(p),JSON.stringify(t));}
/* migrace ze staré verze (jen OneDrive) */
(()=>{const o=lsGet('badcars.od.token');if(o&&!lsGet(tokKey('onedrive'))){lsSet(tokKey('onedrive'),o);lsSet(CUR_KEY,'onedrive');}lsDel('badcars.od.token');if(lsGet('badcars.od.was')){lsSet(WAS_KEY,'onedrive');lsDel('badcars.od.was');}})();
const OD_AUTH='https://login.microsoftonline.com/'+CFG.tenant+'/oauth2/v2.0/',OD_SCOPE='Files.ReadWrite.AppFolder offline_access';
const OD_FILE='https://graph.microsoft.com/v1.0/me/drive/special/approot:/badcars-backup.json';
const GD_SCOPE='https://www.googleapis.com/auth/drive.appdata',GD_API='https://www.googleapis.com/drive/v3/files',GD_UP='https://www.googleapis.com/upload/drive/v3/files';
async function odTokenReq(params){
  const r=await withTimeout(fetch(OD_AUTH+'token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params).toString()}),15000);
  const j=await r.json();if(!r.ok||!j.access_token)throw new Error(j.error_description||j.error||'token');
  const old=getTok('onedrive')||{};setTok('onedrive',{access:j.access_token,refresh:j.refresh_token||old.refresh,exp:Date.now()+(j.expires_in||3600)*1000});
}
const PROV={
  onedrive:{name:'OneDrive',where:'složka Apps/BadCars',configured:()=>!!CFG.clientId,
    async login(){const ver=rand(32),st=rand(8);lsSet(PEND_KEY,JSON.stringify({p:'onedrive',ver:ver,st:st}));
      location.href=OD_AUTH+'authorize?'+new URLSearchParams({client_id:CFG.clientId,response_type:'code',redirect_uri:REDIRECT,response_mode:'query',scope:OD_SCOPE,state:st,code_challenge:await s256(ver),code_challenge_method:'S256',prompt:'select_account'}).toString();},
    async finish(pend,q){if(q.has('error'))throw new Error(q.get('error_description')||q.get('error'));if(!q.has('code'))return false;
      if(pend.st!==q.get('state'))throw new Error('neplatný stav');
      await odTokenReq({client_id:CFG.clientId,grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIRECT,code_verifier:pend.ver,scope:OD_SCOPE});return true;},
    async token(){const t=getTok('onedrive');if(!t)return null;if(t.exp>Date.now()+60000)return t.access;if(!t.refresh)return null;
      try{await odTokenReq({client_id:CFG.clientId,grant_type:'refresh_token',refresh_token:t.refresh,scope:OD_SCOPE});return getTok('onedrive').access;}catch(e){lsDel(tokKey('onedrive'));return null;}},
    async read(){const m=await cfetch('onedrive',OD_FILE);if(m.status===404)return {data:null,etag:null};if(!m.ok)throw new Error('OneDrive '+m.status);
      const meta=await m.json(),c=await cfetch('onedrive',OD_FILE+':/content');if(!c.ok)throw new Error('OneDrive '+c.status);return {data:JSON.parse(await c.text()),etag:meta.eTag||null};},
    async write(text,etag){const h={'Content-Type':'application/json'};if(etag)h['If-Match']=etag;
      const r=await cfetch('onedrive',OD_FILE+':/content?@microsoft.graph.conflictBehavior=replace',{method:'PUT',headers:h,body:text});
      if(r.status===412){const e=new Error('conflict');e.conflict=true;throw e;}if(!r.ok)throw new Error('OneDrive '+r.status);}
  },
  gdrive:{name:'Google Drive',where:'skrytá data aplikace na Disku Google',configured:()=>!!CFG.googleClientId,
    async login(){const st=rand(8);lsSet(PEND_KEY,JSON.stringify({p:'gdrive',st:st}));
      location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:CFG.googleClientId,redirect_uri:REDIRECT,response_type:'token',scope:GD_SCOPE,state:st,include_granted_scopes:'true'}).toString();},
    async finish(pend,q,h){if(h.has('error'))throw new Error(h.get('error'));if(!h.has('access_token'))return false;
      if(pend.st!==h.get('state'))throw new Error('neplatný stav');
      setTok('gdrive',{access:h.get('access_token'),exp:Date.now()+(+h.get('expires_in')||3600)*1000});return true;},
    async token(){const t=getTok('gdrive');return t&&t.exp>Date.now()+60000?t.access:null;},
    async fileMeta(){const r=await cfetch('gdrive',GD_API+'?'+new URLSearchParams({spaces:'appDataFolder',q:"name='badcars-backup.json' and trashed=false",fields:'files(id,version)',pageSize:'10'}));
      if(!r.ok)throw new Error('Google Drive '+r.status);const j=await r.json();return (j.files||[])[0]||null;},
    async read(){const f=await this.fileMeta();if(!f)return {data:null,etag:null};const c=await cfetch('gdrive',GD_API+'/'+f.id+'?alt=media');
      if(!c.ok)throw new Error('Google Drive '+c.status);return {data:JSON.parse(await c.text()),etag:f.id+'@'+f.version};},
    async write(text,etag){
      if(etag){const id=etag.split('@')[0],f=await this.fileMeta();if(!f||f.id+'@'+f.version!==etag){const e=new Error('conflict');e.conflict=true;throw e;}
        const r=await cfetch('gdrive',GD_UP+'/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:text});if(!r.ok)throw new Error('Google Drive '+r.status);return;}
      if(await this.fileMeta()){const e=new Error('conflict');e.conflict=true;throw e;}
      const bd='bc'+rand(8),body='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:'badcars-backup.json',parents:['appDataFolder']})+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+text+'\r\n--'+bd+'--';
      const r=await cfetch('gdrive',GD_UP+'?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:body});if(!r.ok)throw new Error('Google Drive '+r.status);}
  }
};
const provList=()=>Object.keys(PROV).filter(k=>PROV[k].configured());
const curProv=()=>{const p=lsGet(CUR_KEY);return p&&PROV[p]&&PROV[p].configured()?p:null;};
const pname=()=>{const p=curProv()||lsGet(WAS_KEY);return p&&PROV[p]?PROV[p].name:'cloud';};
async function cfetch(p,url,opt){
  const tok=await PROV[p].token();if(!tok)throw authErr();
  opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+tok},opt.headers||{});
  const r=await withTimeout(fetch(url,opt),20000);
  if(r.status===401){lsDel(tokKey(p));throw authErr();}
  return r;
}
const cloudSignedIn=()=>{const p=curProv();return !!(p&&getTok(p));};
function cloudLogin(p){if(!PROV[p]||!PROV[p].configured())return;const c=curProv();if(c&&c!==p)lsDel(tokKey(c));lsSet(CUR_KEY,p);PROV[p].login();}
function cloudLogout(){const p=curProv();if(p)lsDel(tokKey(p));lsDel(CUR_KEY);lsDel(WAS_KEY);loginNeeded=false;cloud=null;odMsg='';setSync('local');if(!$('#sheet').className)render();}
async function handleRedirect(){
  const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));
  if(!q.has('code')&&!q.has('error')&&!h.has('access_token')&&!h.has('error'))return;
  history.replaceState({},'',REDIRECT);
  let pend=null;try{pend=JSON.parse(lsGet(PEND_KEY));}catch(e){}lsDel(PEND_KEY);
  if(!pend||!PROV[pend.p]){odMsg='Přihlášení selhalo, zkus to znovu.';return;}
  try{if(await PROV[pend.p].finish(pend,q,h)){lsSet(CUR_KEY,pend.p);lsSet(WAS_KEY,pend.p);loginNeeded=false;}}
  catch(e){odMsg='Přihlášení k '+PROV[pend.p].name+' selhalo: '+e.message;}
}
const lastBackup=()=>lsGet(LAST_KEY)||'';
const SYNC_TXT={
  off:'Cloudová záloha není nastavená (config.js). Data jsou jen v tomto zařízení, zálohuj je ručně do souboru.',
  local:'Nejsi přihlášený k žádnému cloudu. Data jsou jen v tomto zařízení.',
  ok:'Lokální data se průběžně zálohují. Záloha se nikdy nepřepisuje starším stavem, jen doplňuje.',
  busy:'Zálohuji…',
  err:'Poslední záloha selhala, data zůstávají v zařízení. Zkus to znovu nebo se znovu přihlas.'};
function infoText(st){const p=curProv();return (provList().length?(st==='ok'&&p?'Záloha: '+PROV[p].name+' ('+PROV[p].where+'). ':'')+SYNC_TXT[st]:SYNC_TXT.off)+(st==='ok'&&lastBackup()?' Poslední záloha: '+new Date(+lastBackup()).toLocaleString('cs-CZ')+'.':'')+(odMsg?' '+odMsg:'');}
function setSync(st){syncSt=st;const e=$('#sync');if(e){e.textContent=({local:'⚠ jen v zařízení',ok:'☁ '+pname(),busy:'⟳ zálohuji…',err:'⚠ záloha selhala'})[st];e.className='sync '+st;}const i=$('#syncinfo');if(i)i.textContent=infoText(st);}
const byId=(a,b)=>a.id<b.id?-1:a.id>b.id?1:0;
function unionList(a,b){const m=new Map((a||[]).map(x=>[x.id,x]));(b||[]).forEach(x=>{if(!x||!x.id)return;const c=m.get(x.id);if(!c||(x.updatedAt||0)>(c.updatedAt||0))m.set(x.id,x);});return Array.from(m.values()).sort(byId);}
const KEYS=['vehicles','fuelings','odos','repairs','tasks','fixed','tires','tireEvents','parts','trips','expenses'];
function localExport(){const o={app:'badcars',v:1},dm=demoIds();KEYS.forEach(k=>{o[k]=(db[k]||[]).filter(x=>k==='vehicles'?dm.indexOf(x.id)<0:dm.indexOf(x.vehicleId)<0).sort(byId);});o.settings=db.settings||null;return o;}
function unionDb(r,l){const o={app:'badcars',v:1};KEYS.forEach(k=>{o[k]=unionList(r&&r[k],l[k]);});o.settings=newerSettings(r&&r.settings,l.settings)||null;return o;}
async function pushOnce(){
  const P=PROV[curProv()],rem=await P.read(),merged=unionDb(rem.data,localExport()),text=JSON.stringify(merged);
  if(rem.data&&JSON.stringify(unionDb(null,rem.data))===text)return;
  if(text===lastPushed)return;
  await P.write(text,rem.etag);lastPushed=text;
}
function authLost(){cloud=null;loginNeeded=true;odMsg='Přihlášení k '+pname()+' vypršelo, přihlas se znovu.';setSync('local');if(!$('#sheet').className)render();}
async function pushAll(){
  if(!cloud||!db.vehicles.some(v=>!v.demo))return;
  if(pushing){again=true;return;}
  pushing=true;setSync('busy');
  try{do{again=false;for(let i=0;i<3;i++){try{await pushOnce();break;}catch(e){if(e.conflict&&i<2)continue;throw e;}}}while(again);
    lsSet(LAST_KEY,String(Date.now()));setSync('ok');}
  catch(e){if(e.auth)authLost();else{odMsg=e.message;setSync('err');}}
  pushing=false;
}
function schedulePush(){if(!cloud||!db.vehicles.some(v=>!v.demo))return;clearTimeout(pushT);setSync('busy');pushT=setTimeout(pushAll,1500);}
async function backupNow(){if(!cloud){odMsg=provList().length?'Nejdřív se přihlas ke cloudu.':'';setSync('local');return;}clearTimeout(pushT);await pushAll();}
async function restoreNow(){
  if(!cloud){odMsg=provList().length?'Nejdřív se přihlas ke cloudu.':'';setSync('local');return null;}
  setSync('busy');
  try{const rem=await PROV[curProv()].read();if(!rem.data){offer=0;setSync('ok');return 0;}
    const n=mergeDb(rem.data);offer=0;persistLocal();if(!$('#sheet').className)render();await pushAll();return n;}
  catch(e){if(e.auth)authLost();else setSync('err');return null;}
}
/* ruční záloha do souboru */
const lastFile=()=>lsGet(FILE_KEY)||'';
async function fileBackup(){
  const text=JSON.stringify(localExport(),null,1),name='badcars-zaloha-'+todayIso()+'.json';
  try{const f=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Záloha BadCars'});lsSet(FILE_KEY,String(Date.now()));return 'Záloha předána ke sdílení. Vyber např. Uložit do Souborů, iCloud nebo Disk Google.';}}
  catch(e){if(e&&e.name==='AbortError')return 'Sdílení zrušeno.';}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();lsSet(FILE_KEY,String(Date.now()));return 'Soubor '+name+' se stahuje.';}
  catch(e){return 'Uložení se nepovedlo: '+e.message;}
}
let updReady=false;
const NAG_DAYS=7,SNOOZE_KEY='badcars.nagSnooze';
function backupNag(){
  if(!db.vehicles.some(v=>!v.deleted&&!v.demo))return '';
  const now=Date.now(),lc=+(lsGet('badcars.lastChange')||0);if(!lc)return '';
  const safe=Math.max(+(lastBackup()||0),+(lastFile()||0));
  if(safe>=lc)return '';
  const first=+(lsGet('badcars.firstSeen')||0)||now;if(!lsGet('badcars.firstSeen'))lsSet('badcars.firstSeen',String(now));
  const since=safe||first,days=Math.floor((now-since)/864e5);
  if(days<NAG_DAYS||+(lsGet(SNOOZE_KEY)||0)>now)return '';
  return '<div class="banner">'+(safe?'Data nebyla zálohována '+days+' dní.':'Data v tomto zařízení zatím nikdy nebyla zálohována.')+' <button class="btn" data-act="nag-backup">Zálohovat</button> <button class="btn" data-act="nag-later">Později</button></div>';
}
function swSetup(){
  try{if(!('serviceWorker' in navigator))return;
    const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if((w.state==='installed'||w.state==='activated')&&had&&!updReady){updReady=true;if(!$('#sheet').className)render();else toast('Je k dispozici nová verze aplikace');}});};
      if(reg.installing)watch(reg.installing);
      reg.addEventListener('updatefound',()=>watch(reg.installing));
      const chk=()=>{try{reg.update();}catch(e){}};
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk();});
      setInterval(chk,30*60*1000);
    }).catch(()=>{});
  }catch(e){}
}
function cloudPanel(){
  const L=provList(),p=curProv(),on=cloudSignedIn();
  if(!L.length)return '<p class="sub">V souboru config.js není nastavené žádné úložiště (OneDrive ani Google Drive).</p>';
  if(on)return '<div class="kv"><span>Připojeno</span><b>'+PROV[p].name+'</b></div><div class="actions"><button type="button" class="btn" data-act="backup">Zálohovat teď</button><button type="button" class="btn" data-act="restore">Obnovit ze zálohy</button></div><div class="actions"><button type="button" class="btn" data-act="cloud-logout">Odpojit '+PROV[p].name+'</button></div>';
  return '<div class="actions">'+L.map(k=>'<button type="button" class="btn" data-act="cloud-login" data-p="'+k+'">Připojit '+PROV[k].name+'</button>').join('')+'</div>'+(L.length>1?'<p class="sub" style="margin:0">Zálohovat jde vždy do jednoho úložiště. Přepnutím na jiné se to původní odpojí (záloha v něm zůstane).</p>':'');
}
const confirmLogout=()=>{try{return confirm('Odpojit '+pname()+'? Data v zařízení i záloha v cloudu zůstanou.');}catch(e){return true;}};
function fileSection(){const d=lastFile();return '<h2>Ruční záloha do souboru</h2><p class="sub" style="margin:0">Funguje bez registrace. Na telefonu se otevře Sdílet, kde zvolíš Uložit do Souborů, iCloud, Disk Google nebo e-mail. Obnovení ze souboru data sloučí, nic nepřepíše.</p><div class="actions"><button type="button" class="btn" data-act="file-backup">Uložit zálohu do souboru</button><button type="button" class="btn" data-act="file-restore">Obnovit ze souboru</button></div><p class="sub" id="fileinfo">'+(d?'Poslední ruční záloha: '+new Date(+d).toLocaleString('cs-CZ')+'.':'Ruční zálohu jsi v tomto zařízení zatím neuložil.')+'</p>';}
async function startup(){
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  swSetup();
  if(!provList().length){setSync('local');return;}
  await handleRedirect();
  if(!cloudSignedIn()){loginNeeded=!!(lsGet(WAS_KEY)&&PROV[lsGet(WAS_KEY)]&&PROV[lsGet(WAS_KEY)].configured());setSync('local');render();return;}
  cloud=true;setSync('busy');
  try{const rem=await PROV[curProv()].read();
    if(!db.vehicles.some(v=>!v.deleted&&!v.demo)){offer=rem.data?(rem.data.vehicles||[]).filter(v=>!v.deleted).length:0;render();setSync('ok');}
    else{if(rem.data&&adoptSettings(rem.data.settings))render();await pushAll();}
  }catch(e){if(e.auth)authLost();else{odMsg=e.message;setSync('err');}}
}
startup();
